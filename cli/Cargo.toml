[package]
name = "chittr-cartridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Check, pack, scaffold and watch Chittr Cartridges"

[lib]
name = "chittr_cartridge_cli"
path = "src/lib.rs"

[[bin]]
name = "chittr-cartridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
include_dir = "0.7"
liquid = "0.26"
liquid-core = "0.26"
notify = "8"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
wasmparser = "0.262"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3"
wat = "1"
