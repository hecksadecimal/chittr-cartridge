[package]
name = "poll-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.1.0"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64-serde = "0.7"
base64 = "0.21"
# The SDK's host functions: the poll's KV, timer, Poster Action, Render Push and asset calls.
chittr-cartridge = { package = "chittr-cartridge-sdk", path = "../../sdk/chittr-cartridge" }

[dev-dependencies]
# The fake host the poll's tests run against (`cargo test`).
chittr-cartridge = { package = "chittr-cartridge-sdk", path = "../../sdk/chittr-cartridge", features = ["testing"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
