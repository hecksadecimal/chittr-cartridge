[package]
name = "breakout-canvas"
version = "0.1.0"
edition = "2021"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.1.0"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64-serde = "0.7"
base64 = "0.21"
chittr-cartridge = { package = "chittr-cartridge-sdk", path = "../../../sdk/chittr-cartridge", default-features = false, features = ["canvas"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
