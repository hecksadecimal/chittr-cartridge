    # ---- v2: capabilities, files and configuration ------------------------------------------------------------
    ServerLimits:
      description: The effective v2 resource limits for a Server Guest. The numbers may differ from the documented defaults, so a guest reads them here rather than hard-coding them.
      required:
        - maxFileBytes
        - maxFileReadBytes
        - maxFileHandles
        - maxPickers
      properties:
        maxFileBytes:
          type: integer
          format: int64
          description: The largest file a picker may deliver, in bytes.
        maxFileReadBytes:
          type: integer
          format: int64
          description: The largest file_read chunk, in bytes.
        maxFileHandles:
          type: integer
          format: int32
          description: The live file handles allowed. A Server Guest has one, scoped to its on_file call.
        maxPickers:
          type: integer
          format: int32
          description: The file pickers allowed per template.
    FileRef:
      description: Metadata for a file a picker delivered. The id is an opaque, scoped handle; the file's bytes are never part of a JSON envelope.
      required:
        - id
        - filename
        - mimeType
        - size
      properties:
        id:
          type: string
          description: The opaque handle, scoped to one on_file call (server) or one canvas instance (client).
        filename:
          type: string
          description: The display name the browser reported. It is never a path and never trusted for content type.
        mimeType:
          type: string
          description: The MIME type the browser reported. It is a hint only, never validation.
        size:
          type: integer
          format: int64
          description: The file's byte length as the host measured it, not as the client claimed it.
    FileInput:
      description: Input to on_file, a server-routed file from an authorized picker. The handle is scoped to this call and revoked when the Hook settles, including timeout, cancellation and failure.
      required:
        - v
        - hook
        - chitt
        - observer
        - surface
        - name
        - file
      properties:
        v:
          type: integer
          format: int32
          description: The ABI version. Always 2.
        hook:
          type: string
          description: The Hook's name, on_file.
        chitt:
          $ref: "#/components/schemas/ChittRef"
        observer:
          $ref: "#/components/schemas/Observer"
          description: The signed-in Character who selected the file. A server-routed picker requires a signed-in viewer, so this is never null.
        surface:
          type: string
          description: The render surface the picker was on, card or config. The host sets it.
        name:
          type: string
          description: The picker name from the template.
        file:
          $ref: "#/components/schemas/FileRef"
    FileOutput:
      description: Output of on_file. The normal return is an empty object; rerender draws the sender's card again through render. There is no reply, because the file did not come from the canvas worker.
      required: []
      properties:
        rerender:
          type: boolean
          description: True to draw the sender's card again through render.
        error:
          $ref: "#/components/schemas/HookError"
    ConfigAccess:
      description: The host's authorization context for a configuration render or action. The guest cannot set it and cannot widen it; Liquid conditions may narrow presentation but never grant access.
      required:
        - audience
        - isOwner
        - isAdmin
        - canConfigure
      properties:
        audience:
          type: string
          description: The strictest audience the configuration declarations require, one of owner, admin or owner_or_admin. XTP cannot enumerate these as identifiers, so the host checks the value.
        isOwner:
          type: boolean
          description: Whether the acting Observer's account owns the posting Character.
        isAdmin:
          type: boolean
          description: Whether the acting user holds the explicit administrative configuration permission.
        canConfigure:
          type: boolean
          description: The host's final decision for this request. False means the configuration render or action must not run.
    RenderConfigInput:
      description: Input to render_config, run only for an authorized owner or admin opening the Cartridge configuration panel. surface and access are host-computed and cannot be chosen by the guest, which is why there is no template field.
      required:
        - v
        - hook
        - chitt
        - observer
        - surface
        - access
      properties:
        v:
          type: integer
          format: int32
          description: The ABI version. Always 2.
        hook:
          type: string
          description: The Hook's name, render_config.
        chitt:
          $ref: "#/components/schemas/ChittRef"
        observer:
          $ref: "#/components/schemas/Observer"
          description: The signed-in Character opening the configuration. Anonymous viewers receive no configuration tree or data, so this is never null.
        surface:
          type: string
          description: Always config. The host sets it.
        access:
          $ref: "#/components/schemas/ConfigAccess"
    RenderConfigOutput:
      description: Output of render_config. data is what config.liquid draws with; the template name is fixed and there is no canvas state.
      required: []
      properties:
        data:
          type: object
          description: The values config.liquid draws with. Any JSON object within the render output cap. XTP has no untyped value, so this is typed as an object; the host accepts any JSON that fits.
        error:
          $ref: "#/components/schemas/HookError"
    FileErrorCode:
      description: Why a file host function failed. not_found covers unknown, closed, expired and foreign handles.
      type: string
      enum:
        - invalid
        - not_found
        - too_large
        - not_supported
        - host
    FileError:
      description: A failed file_read or file_close call.
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/FileErrorCode"
        message:
          type: string
          description: Plain text explaining the failure.
    FileReadInput:
      description: Input to file_read. Reads at most 64 KiB from a file handle; the result clips at EOF.
      required:
        - handle
        - offset
        - length
      properties:
        handle:
          type: string
          description: The handle a file picker delivered.
        offset:
          type: integer
          format: int64
          description: The byte offset to read from. Non-negative; an offset past the end is invalid.
        length:
          type: integer
          format: int64
          description: The number of bytes to read, 1 to 65536. Over the cap is too_large, not a clamp.
    FileReadOutput:
      description: Output of file_read. bytes is a bounded chunk, base64 encoded, never the whole file. eof is true when the read reached the end.
      required: []
      properties:
        bytes:
          type: string
          format: byte
          description: The bytes read, base64 encoded. At most 64 KiB before encoding, and empty at EOF.
        eof:
          type: boolean
          description: True when the read reached the end of the file.
        error:
          $ref: "#/components/schemas/FileError"
    FileCloseInput:
      description: Input to file_close.
      required:
        - handle
      properties:
        handle:
          type: string
          description: The handle to release. Closing an unknown or already-closed handle is harmless.
    FileCloseOutput:
      description: Output of file_close. The normal return is an empty object.
      required: []
      properties:
        error:
          $ref: "#/components/schemas/FileError"
